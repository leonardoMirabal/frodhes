# The intended sound changes of the next release against the last one (tools/release_diff.py, `make pristine` and
# `make release-diff`). Every value that moves beyond its tolerance in either direction must match an entry here, with
# a reason, or the gate fails. An entry never lifts a pristine ceiling (distortion, aliasing, clicks, noise, clips,
# louder after the key-up): those hold whatever is listed.
#
# Reviewed: every new or widened entry needs the coordinator's sign-off, named in the commit message (AGENTS.md 5b).
# At a release: `against` moves to the new release, the fast baseline is re-measured on the release's own tree
# (tools/release_diff.py --save-base), and this list is emptied.
#
# An entry:
#   - match: "fm1/MARIMBA/*"       # fnmatch on <build>/<TYPE or preset>/<FXOFF|RAW|FX|PRESET>/<A|B>/<cell>,
#                                  # cell: k<key>v<vel>, chord-<name>, pedal or script
#     metric: "level peak"         # space-separated fnmatch patterns (H2..H6 inh imd level peak cent decay keyup clk
#                                  # clk_off noise clip lu cb lim)
#     min: -4.0                    # optional: the allowed move (dB; cent: a ratio - 1)
#     max: -2.0
#     reason: "MARIMBA re-levelled to STAGE 77 (commit ...), measured -3.2 LU"
#   keyup / decay whose window is exact zeros read "silent" (a state, never a dB value); a change silent <-> sounding
#   is listed only by an entry naming the exact cell, its one metric and `silent: true` (the candidate is silent) or
#   `silent: false` (the last release was; min / max then bound the candidate's own value, dB).
#   `tools/release_diff.py --draft FILE` writes the unlisted moves in this form, each with reason TODO (which fails).

against: v0.9.12
changes:
# ---- quick.py's level gate (tools/quick.py `level`: tests/baselines/quick_level_0911*.json, its own anchor on 0.9.11's
# build, never re-saved here): its listed level moves against that anchor stay. The release diff's own entries
# (0.9.12's moves against 0.9.11) went with the move of `against` to v0.9.12: 0.9.13 moves no release-diff cell
# beyond its tolerance (make release-diff, 2026-11-16: 0 moved, 0 over a pristine ceiling).
  - {match: "quick-level/*/TYPE-VIBES/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: "quick-level/*/TYPE-MARIMBA/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: "quick-level/*/VIBES/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: "quick-level/*/VIBES ECHO/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: "quick-level/*/MARIMBA/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: "quick-level/*/WOOD ECHO/*", metric: level, min: -3.2, max: -1.2, reason: "SND3 balance: the bars -3.0 dB into the mix (bars.c BAR_MIX_G) to keep 0.9.9's balance at v100 against the electric piano's new FULL curve; at v127, where the piano is unchanged, the bars' chord and note read -1.5 .. -2.9 dB cb against 0.9.11 (the trade the coordinator asked for, 2026-11-14)"}
  - {match: 'quick-level/*/SUITCASE/note', metric: level, min: -2.1, max: -1.2, reason: 'A2 (0.9.12) SUITCASE''s own voice (bark 0.8, its clean top 4 dB deeper): the v127 A2 note on F02 / F08 reads 1.5 .. 1.8 dB quieter in critical bands at the same RMS (-0.1 .. -0.3 dB) and LUFS: fewer partials; the TYPE itself within the limit (-1.2 .. -1.4)'}
  - {match: 'quick-level/*/SUIT TREM/note', metric: level, min: -2.0, max: -1.2, reason: 'A2 (0.9.12) SUITCASE''s own voice (bark 0.8, its clean top 4 dB deeper): the v127 A2 note on F02 / F08 reads 1.5 .. 1.8 dB quieter in critical bands at the same RMS (-0.1 .. -0.3 dB) and LUFS: fewer partials; the TYPE itself within the limit (-1.2 .. -1.4)'}
