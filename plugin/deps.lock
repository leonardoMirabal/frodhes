# The desktop plugin's dependencies, pinned by commit (tools/plugin_deps.sh fetches them into .local/plugin-deps;
# plugin/cmake/deps.cmake checks each checkout's HEAD against this file and refuses anything else). Nothing here is
# vendored in git. One line each: kind name url ref commit-or-sha256 licence
#   git   a shallow checkout of that commit (submodules: the VST3 SDK's four the wrapper needs, at the commits the tag records)
#   zip   a release archive, checked by its sha256 (test tools only: never linked into the plugin)
# A name ending in @macos, @linux or @windows is that system's build of the tool: fetched only there (or for
# FRP_DEPS_OS), into the folder named without the suffix.
