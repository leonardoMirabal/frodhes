name: ci
# a PR runs once (pull_request); main runs on its push; a newer push cancels the older run of the same ref
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    # arm64 Linux: the same machine as a local `docker run python:3.14` on an Apple-silicon Mac (a replica of this job)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest pytest-xdist==3.8.0
      - run: make test
      - run: make host
      - run: make pytest PY=python3
  # The engines' tables are generated on macOS (Accelerate); their regeneration must give the committed headers byte
  # for byte on every machine (the solver-sensitive stages are pinned: rhodes_pins.json, bars_fe_pins.json,
  # bars_pins.json). The host job checks it on Linux arm64; this one on macOS, with the same numpy / scipy as the
  # development machine. It is required: a failure fails the run.
  generators-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - run: python -m pytest -q -rs tests/py/test_gen_bars.py tests/py/test_marimba_calib.py
      - run: '! python -m pytest -q -rs tests/py/test_gen_bars.py -k deterministic | grep -q SKIPPED'
  # The browser emulator (web/build.sh, Emscripten pinned in tools/get_emsdk.sh) must build and pass its selftest
  # (tools/release.py --web-selftest: Chromium + WebKit at 1280 and 390 px, sound, a lit screen, no page errors, the
  # version shown, the installer through the page on a fake FM-1 in Chromium), the installer's own tests
  # (tests/web/install_test.js, node: a fake FM-1) and the knob test (tests/py/test_web_knobs.py) must run and pass. Nothing is deployed here: only a v* tag (release.yml) publishes the emulator.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/emsdk
          key: emsdk-${{ hashFiles('tools/get_emsdk.sh') }}-${{ runner.os }}-${{ runner.arch }}
      - run: sh tools/get_emsdk.sh .local/emsdk
      - run: sh web/build.sh
      - name: the installer against a fake FM-1 (node)
        run: node tests/web/install_test.js
      - run: |
          pip install playwright==1.64.0 pytest
          python3 -m playwright install --with-deps chromium webkit
      - run: python3 tools/release.py --web-selftest web/dist dev
      - name: the knob test (must run, not skip)
        run: |
          python3 -m pytest -q -rs tests/py/test_web_knobs.py > knobs.txt || { cat knobs.txt; exit 1; }
          cat knobs.txt
          ! grep -q SKIPPED knobs.txt
