name: ci
on: [push, pull_request]
jobs:
  host:
    # arm64 Linux: the same machine as a local `docker run python:3.14` on an Apple-silicon Mac (a replica of this job)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest pytest-xdist==3.8.0
      - run: make test
      - run: make host
      - run: make pytest PY=python3
  # The engines' tables are generated on macOS (Accelerate); their regeneration must give the committed headers byte
  # for byte on every machine (the solver-sensitive stages are pinned: rhodes_pins.json, bars_fe_pins.json,
  # bars_pins.json). The host job checks it on Linux arm64; this one on macOS, with the same numpy / scipy as the
  # development machine. It is required: a failure fails the run.
  generators-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - run: python -m pytest -q -rs tests/py/test_gen_bars.py
      - run: '! python -m pytest -q -rs tests/py/test_gen_bars.py -k deterministic | grep -q SKIPPED'
