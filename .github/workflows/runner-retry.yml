name: runner-retry
# GitHub sometimes never starts a job: "The job was not acquired by Runner of type hosted even after multiple
# attempts" (macOS arm64 capacity, 2026-11-12, twice on one release). The job then fails with no step run and the
# whole run is red though no test ran. When a ci, plugin or release run fails and EVERY failed or cancelled job of it
# ran no step, this reruns its failed jobs (gh run rerun --failed), up to attempt 3; a job that ran and failed is a
# real failure and is left alone.
on:
  workflow_run:
    workflows: [ci, plugin, release]
    types: [completed]
permissions:
  actions: write                     # gh run rerun
  contents: read
jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: rerun the jobs GitHub never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.steps | length)\t\(.name)"' > bad.txt
          cat bad.txt
          if [ ! -s bad.txt ]; then echo "no failed job"; exit 0; fi
          if awk -F'\t' '$1 != 0 { found = 1 } END { exit !found }' bad.txt; then
            echo "a job ran and failed: a real failure, not rerun"; exit 0
          fi
          echo "every failed job ran no step (no runner): rerun attempt $((ATTEMPT + 1)) of 3"
          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
