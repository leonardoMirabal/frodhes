name: runner-retry
# GitHub sometimes never starts a job: "The job was not acquired by Runner of type hosted even after multiple
# attempts" (macOS arm64 capacity, 2026-11-12, twice on one release). The job then fails with no step run and the
# whole run is red though no test ran. When a ci, plugin or release run fails (or is cancelled: since 2026-11-15 a
# real failure cancels the whole ci run), tools/runner_retry.py decides: rerun the failed jobs (gh run rerun --failed,
# up to attempt 3) only when at least one job failed and no failed or cancelled job ran a step. A job that ran and
# failed, or a sibling cancelled after it started, is a real failure and is left alone.
on:
  workflow_run:
    workflows: [ci, plugin, release]
    types: [completed]
permissions:
  actions: write                     # gh run rerun
  contents: read
jobs:
  retry:
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
      && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # (tools/runner_retry.py, the default branch's)
      - name: rerun the jobs GitHub never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" > jobs.json
          python3 tools/runner_retry.py jobs.json | tee decision.txt
          if grep -q '^rerun:' decision.txt; then
            echo "rerun attempt $((ATTEMPT + 1)) of 3"
            gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
          fi
