name: release
# A version tag (v0.9.1, v0.9.2 ...) builds the firmware and publishes the GitHub release with the .fwsc attached
# (as frodhes-X.Y.Z.fwsc and frodhes.fwsc), the FM-1's two-core image (./build.sh --c1: frodhes-X.Y.Z-c1.fwsc and
# frodhes-c1.fwsc), and the SMK-37 builds next to them, each under a fixed name and a
# versioned one: frodhes-smk37-pro.fwsc / frodhes-X.Y.Z-smk37-pro.fwsc, frodhes-smk37-elite.fwsc /
# frodhes-X.Y.Z-smk37-elite.fwsc, frodhes-mke-p37.fwsc / frodhes-X.Y.Z-mke-p37.fwsc (./build.sh --board smk37 [--model elite|mke]; identity SMK-37 Pro_470,
# SMK-37 Elite_470, MKE-P37_470, as tools/build.py sets them). The notes are docs/releases/<tag>.md (tools/release.py
# assembles them).
# The emulator (web/) goes live at the same moment as the release: the job web builds it from the tag
# (web/build.sh --release X.Y.Z: the page shows that version) and runs its selftest (Chromium + WebKit) before
# anything is published, and a failure stops the release; the job release then creates the release as a draft,
# deploys the tested web/dist to the gh-pages branch (tools/deploy_pages.sh: "Emulator X.Y.Z", the branch's other files
# kept), waits until Pages has built that commit and serves every file byte for byte (tools/pages_wait.sh), and only
# then publishes the release and marks it latest. Every step is safe to rerun. Only a v* tag deploys: a merge to main
# never touches gh-pages (ci.yml builds and tests the emulator, nothing more). The FM-1 package goes with the
# emulator (tools/web_firmware.sh: frodhes.fwsc, the SMK-37 builds and firmware.json with their sha256) for the page's installer.
# The Move package (private plan 05 M7-02): the job move builds it from the tag (make move, reproducible) on arm64 in
# Debian bookworm (the Move's userland, as ci.yml's move job); the release attaches it, as frodhes-X.Y.Z-move.tar.gz
# and frodhes-module.tar.gz, only when the release commit records that exact tarball's sha256 as tested on the Move
# (tools/move_asset.sh: no record, no Move asset; a different sha256 stops the release), after tools/move_catalog.py
# checked the tag's tarball (one folder frodhes/, module.json's version the tag's). The job release-json then writes
# release.json to main for Schwung Manager (see that job: it needs a key that may push to main).
# The desktop plugin: the job plugin runs .github/workflows/plugin.yml on the tag (macOS, Windows, Linux x86_64 and
# aarch64: built with the tag's version, packaged, checked self-contained, validated); the job release attaches its
# packages to the draft under fixed names (frodhes-plugin-macos.pkg, frodhes-plugin-macos.zip,
# frodhes-plugin-windows.zip, frodhes-plugin-linux-x86_64.zip, frodhes-plugin-linux-aarch64.zip), only those of the
# platforms the release commit records as tested ("Plugin tested: macos windows linux-x86_64 ...", tools/plugin_asset.sh:
# no record, no plugin asset). The release waits for the plugin: nothing goes public until every asset is attached
# (v0.9.11, 2026-11-12: the release went public while GitHub left the plugin's macOS job without a runner, and the
# docs' plugin links pointed at nothing). runner-retry.yml reruns a job GitHub never started.
# Tag only what passed the tests on the FM-1 (CLAUDE.md: test and document).
on:
  push:
    tags: ['v*']
permissions:
  contents: write                    # the release, and the push to gh-pages
  actions: read                      # ci-gate reads the ci runs
  pages: write                       # tools/pages_wait.sh reads the Pages builds (and asks for one if none started)
jobs:
  # ci.yml already runs every host test (host + generators-macos) on each push to main. If ci passed on exactly this
  # commit (waiting up to 40 min if it is still running), or on a commit with the identical git tree (the PR's head,
  # when this tag is on GitHub's merge commit of it: the same code), the release skips its own copy of the tests; if
  # ci failed, never ran or timed out, the fallback jobs below (host, generators-macos) run them here, and a failure stops the
  # release before the build and publish.
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/ci_gate.sh "$GITHUB_SHA"
  generators-macos:                  # fallback only: the tables regenerate byte for byte (macOS, as ci.yml)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 websockets==16.1.1 pytest
      - shell: bash                  # (one run; its -v lines show the deterministic test PASSED, not SKIPPED)
        run: |
          python tools/pytest_run.py -v -rs -- tests/py/test_gen_bars.py tests/py/test_marimba_calib.py | tee gen.txt
          grep -q 'test_gen_bars.py::test_deterministic_and_up_to_date PASSED' gen.txt
  host:                              # fallback only: every host test (ci.yml's host job, on the same arm64 runner)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 websockets==16.1.1 pytest pytest-xdist==3.8.0 mido==1.3.3 PyYAML==6.0.3
      - name: host tests (fallback only, when ci did not pass on this commit)
        run: make test && make host && make pytest PY=python3
  web:                               # the emulator from the tag, built and selftested before anything is published
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.0-noble   # (the browsers' libraries in the image; apt only for xz)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/emsdk
          key: emsdk-${{ hashFiles('tools/get_emsdk.sh') }}-${{ runner.os }}-${{ runner.arch }}-playwright-image
      - name: xz (emsdk unpacks node from a .tar.xz; the image has no xz)
        run: apt-get update -qq && apt-get install -y -qq xz-utils
      - name: Emscripten (the version pinned in tools/get_emsdk.sh)
        run: sh tools/get_emsdk.sh .local/emsdk
      - name: build the emulator
        run: sh web/build.sh --release "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@v4   # (Playwright's Python image has no node)
        with:
          node-version: 20
      - name: the installer against a fake FM-1 (node)
        run: node tests/web/install_test.js
      - name: Playwright (Chromium + WebKit)
        run: |
          pip install playwright==1.64.0
          python3 -m playwright install chromium webkit
      - name: selftest
        run: python3 tools/release.py --web-selftest web/dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
  move:                              # the Move package from the tag (tools/move_asset.sh decides whether it ships)
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates make gcc libc6-dev
      - uses: actions/checkout@v4
      - name: build the Move package
        run: |
          make move MOVE_RUN= MOVE_VER="${GITHUB_REF_NAME#v}"
          sha256sum build/move/frodhes-module.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: move-package
          path: build/move/frodhes-module.tar.gz
          if-no-files-found: error
  release:
    needs: [ci-gate, generators-macos, host, web, move, plugin]
    # runs when ci passed on this commit (the fallback jobs skipped) or when both fallback jobs passed, and the
    # emulator built and passed its selftest. x86_64: the JieLi toolchain (tools/get_toolchain.sh) runs on nothing else
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' && needs.web.result == 'success' &&
      needs.move.result == 'success' && needs.plugin.result == 'success' &&
      (needs.ci-gate.outputs.passed == 'true' ||
       (needs.generators-macos.result == 'success' && needs.host.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      move: ${{ steps.move-pkg.outputs.shipped }}   # 'true' when the release carries the Move package (job release-json)
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # (tools/move_asset.sh reads the release commit)
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1
      - name: the JieLi toolchain and the 3 AC79 SDK files (checked by sha256 in the build)
        run: |
          sh tools/get_toolchain.sh .local/jieli
          sh tools/get_sdk.sh .local/fw-AC79_AIoT_SDK
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --c1 --release "$V"           # the two-core image first (build/frodhes-X.Y.Z-c1.fwsc)
          ./build.sh --release "$V"
          ls -l "build/frodhes-$V.fwsc" "build/frodhes-$V-c1.fwsc"
          sha256sum "build/frodhes-$V.fwsc" "build/frodhes-$V-c1.fwsc"
      - name: build the SMK-37 packages
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --board smk37 --release "$V"
          ./build.sh --board smk37 --model elite --release "$V"
          ./build.sh --board smk37 --model mke --release "$V"
          ls -l "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
          sha256sum "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
      - name: the Move package built by the job move
        uses: actions/download-artifact@v4
        with:
          name: move-package
          path: build/move-ci
      - name: the Move package, if tested
        run: sh tools/move_asset.sh "${GITHUB_REF_NAME#v}" build/move-ci/frodhes-module.tar.gz build/publish/move
      - name: the Move package as Schwung Manager installs it (frodhes/, module.json's version = the tag's)
        id: move-pkg
        run: |
          python3 tools/move_catalog.py check build/move-ci/frodhes-module.tar.gz "${GITHUB_REF_NAME#v}"
          if [ -f build/publish/move/frodhes-module.tar.gz ]; then echo "shipped=true" >> "$GITHUB_OUTPUT"; fi
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Frodhes $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          # the same file twice: frodhes-X.Y.Z.fwsc, and frodhes.fwsc, the stable name README / MANUAL link as
          # releases/latest/download/frodhes.fwsc (the docs never name a version)
          mkdir -p build/publish
          cp "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc
          # the two-core image the same way: frodhes-X.Y.Z-c1.fwsc and frodhes-c1.fwsc (the docs link the fixed name)
          cp "build/frodhes-$V-c1.fwsc" build/publish/frodhes-c1.fwsc
          # the SMK-37 packages, versioned and under fixed names (the emulator and the docs link the fixed ones)
          # (tools/release.py SMK_ASSETS; the build names them frodhes-X.Y.Z-smk37[-elite|-mke].fwsc)
          for m in "smk37:smk37-pro" "smk37-elite:smk37-elite" "smk37-mke:mke-p37"; do
            cp "build/frodhes-$V-${m%%:*}.fwsc" "build/publish/frodhes-${m#*:}.fwsc"
            cp "build/frodhes-$V-${m%%:*}.fwsc" "build/publish/frodhes-$V-${m#*:}.fwsc"
          done
          set -- "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc \
            "build/frodhes-$V-c1.fwsc" build/publish/frodhes-c1.fwsc \
            "build/publish/frodhes-$V-smk37-pro.fwsc" "build/publish/frodhes-$V-smk37-elite.fwsc" \
            "build/publish/frodhes-$V-mke-p37.fwsc" \
            build/publish/frodhes-smk37-pro.fwsc build/publish/frodhes-smk37-elite.fwsc \
            build/publish/frodhes-mke-p37.fwsc \
            "LICENSES/Apache-2.0.txt#Apache-2.0.txt (the licence of the 3 JieLi SDK files in each .fwsc)"
          # the Move package, when tools/move_asset.sh found it tested (frodhes-X.Y.Z-move.tar.gz, frodhes-module.tar.gz)
          for f in "build/publish/move/frodhes-$V-move.tar.gz" build/publish/move/frodhes-module.tar.gz; do
            if [ -f "$f" ]; then set -- "$@" "$f"; fi
          done
          # a draft: nobody sees it until the emulator of this tag is live ("publish the release" below)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a rerun: the release exists already (a draft left by a failed run, or published): its assets replaced
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Frodhes $V" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$@" --title "Frodhes $V" --notes-file "$NOTES" --draft
          fi
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: build/pages
      - name: the packages next to the emulator, the FM-1's and the SMK-37 builds (its installer; release downloads have no CORS)
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh tools/web_firmware.sh "build/frodhes-$V.fwsc" web/dist "$V" \
            "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" "build/frodhes-$V-smk37-mke.fwsc"
      - name: deploy the emulator
        run: |
          git -C build/pages config user.name "github-actions[bot]"
          git -C build/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh tools/deploy_pages.sh web/dist build/pages "${GITHUB_REF_NAME#v}"
      - name: wait for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sh tools/pages_wait.sh "$(git -C build/pages rev-parse HEAD)" web/dist \
            "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: the plugin packages built by the job plugin
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: build/plugin-ci
      - name: the plugin packages of the platforms the release commit records as tested, attached to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh tools/plugin_asset.sh "${GITHUB_REF_NAME#v}" build/plugin-ci build/publish/plugin
          set -- build/publish/plugin/*
          if [ ! -e "$1" ]; then echo "no plugin asset for this release"; exit 0; fi
          gh release upload "$GITHUB_REF_NAME" "$@" --clobber
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
  # ---- the desktop plugin (see the top): built and validated from the tag by plugin.yml; the job release waits for
  # it and attaches the packages to the draft before publishing. sign: Developer ID + notarization on macOS when the MACOS_* secrets exist (docs/PLUGIN.md "Signing"),
  # else ad-hoc signed.
  plugin:
    uses: ./.github/workflows/plugin.yml
    with:
      version: ${{ github.ref_name }}
      sign: true
    secrets: inherit
  # ---- release.json on main: Schwung Manager's update check (the Move in Schwung's module catalog) ----
  # After the release is public, and only when it carries the Move package (the job release's output move): writes
  # release.json = {"version": "X.Y.Z", "download_url": the tag's frodhes-module.tar.gz} (tools/move_catalog.py
  # release-json, the repository from the origin remote), checks that the URL downloads, commits it to main and
  # pushes. Schwung Manager reads it from main (raw.githubusercontent.com/<repo>/main/release.json) to show the
  # version and install or update. Safe to rerun; an older tag never moves release.json back.
  # NEEDS a push to main that main's protection lets through. main requires the checks host, web and
  # generators-macos for everyone, so a push with the workflow's own token (contents: write, above) is refused. With
  # the repository secret RELEASE_JSON_DEPLOY_KEY (the private half of a deploy key with write access, the key allowed
  # to bypass main's rules in a ruleset) the job pushes with that key. Without the key the job does not push: it writes
  # and checks release.json, shows it in the log and as the artifact release-json, and a notice says to commit it to
  # main by hand (the job stays green). With a key, a refused push fails the job.
  release-json:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.move == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-json
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.RELEASE_JSON_DEPLOY_KEY }}   # (empty: the workflow's token)
      - name: release.json for the tag, committed to main
        env:
          HAS_KEY: ${{ secrets.RELEASE_JSON_DEPLOY_KEY != '' }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [ "$HAS_KEY" != "true" ]; then    # no key: main's protection refuses the push; the release.json is an artifact
            python3 tools/move_catalog.py release-json "$V"
            cat release.json
            URL=$(python3 -c 'import json; print(json.load(open("release.json"))["download_url"])')
            curl -fsIL -o /dev/null "$URL" || { echo "release.json: $URL does not download" >&2; exit 1; }
            echo "::notice::no RELEASE_JSON_DEPLOY_KEY: commit the release.json above (also the artifact release-json) to main by hand"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/move_catalog.py release-json "$V"
            cat release.json
            URL=$(python3 -c 'import json; print(json.load(open("release.json"))["download_url"])')
            curl -fsIL -o /dev/null "$URL" || { echo "release.json: $URL does not download: not committed" >&2; exit 1; }
            git add release.json
            if git diff --cached --quiet; then echo "release.json: unchanged on main"; exit 0; fi
            git commit -q -m "release.json: Frodhes $V on the Move (Schwung Manager's update check)"
            if git push origin HEAD:main; then exit 0; fi
            echo "release.json: push refused (try $try of 3)"; sleep 10
          done
          echo "::error::release.json not pushed to main (its protection: see RELEASE_JSON_DEPLOY_KEY in release.yml): commit the release.json shown above to main by hand"
          exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: release-json
          path: release.json
          if-no-files-found: ignore
