name: release
# A version tag (v0.9.1, v0.9.2 ...) builds the firmware and publishes the GitHub release with the .fwsc attached
# (as frodhes-X.Y.Z.fwsc and frodhes.fwsc), and the SMK-37 builds next to them, marked experimental (not tested on
# hardware): frodhes-smk37-experimental.fwsc, frodhes-smk37-elite-experimental.fwsc and
# frodhes-smk37-mke-experimental.fwsc (./build.sh --board smk37 [--model elite|mke]; identity SMK-37 Pro_470,
# SMK-37 Elite_470, MKE-P37_470, as tools/build.py sets them). The notes are docs/releases/<tag>.md (tools/release.py
# assembles them).
# Tag only what passed the tests on the FM-1 (CLAUDE.md: test and document).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read                      # ci-gate reads the ci runs
jobs:
  # ci.yml already runs every host test (host + generators-macos) on each push to main. If ci passed on exactly this
  # commit (waiting up to 40 min if it is still running), or on a commit with the identical git tree (the PR's head,
  # when this tag is on GitHub's merge commit of it: the same code), the release skips its own copy of the tests; if
  # ci failed, never ran or timed out, the fallback jobs below (host, generators-macos) run them here, and a failure stops the
  # release before the build and publish.
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/ci_gate.sh "$GITHUB_SHA"
  generators-macos:                  # fallback only: the tables regenerate byte for byte (macOS, as ci.yml)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - run: python -m pytest -q -rs tests/py/test_gen_bars.py tests/py/test_marimba_calib.py
      - run: '! python -m pytest -q -rs tests/py/test_gen_bars.py -k deterministic | grep -q SKIPPED'
  host:                              # fallback only: every host test (ci.yml's host job, on the same arm64 runner)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest pytest-xdist==3.8.0
      - name: host tests (fallback only, when ci did not pass on this commit)
        run: make test && make host && make pytest PY=python3
  release:
    needs: [ci-gate, generators-macos, host]
    # runs when ci passed on this commit (the fallback jobs skipped) or when both fallback jobs passed. x86_64: the
    # JieLi toolchain (tools/get_toolchain.sh) runs on nothing else
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      (needs.ci-gate.outputs.passed == 'true' ||
       (needs.generators-macos.result == 'success' && needs.host.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1
      - name: the JieLi toolchain and the 3 AC79 SDK files (checked by sha256 in the build)
        run: |
          sh tools/get_toolchain.sh .local/jieli
          sh tools/get_sdk.sh .local/fw-AC79_AIoT_SDK
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --release "$V"
          ls -l "build/frodhes-$V.fwsc"
          sha256sum "build/frodhes-$V.fwsc"
      - name: build the SMK-37 packages (experimental)
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --board smk37 --release "$V"
          ./build.sh --board smk37 --model elite --release "$V"
          ./build.sh --board smk37 --model mke --release "$V"
          ls -l "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
          sha256sum "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Frodhes $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          # the same file twice: frodhes-X.Y.Z.fwsc, and frodhes.fwsc, the stable name README / MANUAL link as
          # releases/latest/download/frodhes.fwsc (the docs never name a version)
          mkdir -p build/publish
          cp "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc
          # the SMK-37 packages under fixed names, marked experimental (the SMK-37 is not tested on hardware)
          cp "build/frodhes-$V-smk37.fwsc" build/publish/frodhes-smk37-experimental.fwsc
          cp "build/frodhes-$V-smk37-elite.fwsc" build/publish/frodhes-smk37-elite-experimental.fwsc
          cp "build/frodhes-$V-smk37-mke.fwsc" build/publish/frodhes-smk37-mke-experimental.fwsc
          gh release create "$GITHUB_REF_NAME" "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc \
            build/publish/frodhes-smk37-experimental.fwsc build/publish/frodhes-smk37-elite-experimental.fwsc \
            build/publish/frodhes-smk37-mke-experimental.fwsc \
            "LICENSES/Apache-2.0.txt#Apache-2.0.txt (the licence of the 3 JieLi SDK files in each .fwsc)" \
            --title "Frodhes $V" --notes-file "$NOTES" --latest
