name: release
# A version tag (v0.9.1, v0.9.2 ...) builds the firmware and publishes the GitHub release with the .fwsc attached
# (as frodhes-X.Y.Z.fwsc and frodhes.fwsc), and the SMK-37 builds next to them, marked experimental (not tested on
# hardware): frodhes-smk37-experimental.fwsc, frodhes-smk37-elite-experimental.fwsc and
# frodhes-smk37-mke-experimental.fwsc (./build.sh --board smk37 [--model elite|mke]; identity SMK-37 Pro_470,
# SMK-37 Elite_470, MKE-P37_470, as tools/build.py sets them). The notes are docs/releases/<tag>.md (tools/release.py
# assembles them).
# The emulator (web/) goes live at the same moment as the release: the job web builds it from the tag
# (web/build.sh --release X.Y.Z: the page shows that version) and runs its selftest (Chromium + WebKit) before
# anything is published, and a failure stops the release; the job release then creates the release as a draft,
# deploys the tested web/dist to the gh-pages branch (tools/deploy_pages.sh: "Emulator X.Y.Z", the branch's other files
# kept), waits until Pages has built that commit and serves every file byte for byte (tools/pages_wait.sh), and only
# then publishes the release and marks it latest. Every step is safe to rerun. Only a v* tag deploys: a merge to main
# never touches gh-pages (ci.yml builds and tests the emulator, nothing more). The FM-1 package goes with the
# emulator (tools/web_firmware.sh: frodhes.fwsc, the SMK-37 builds and firmware.json with their sha256) for the page's installer.
# Tag only what passed the tests on the FM-1 (CLAUDE.md: test and document).
on:
  push:
    tags: ['v*']
permissions:
  contents: write                    # the release, and the push to gh-pages
  actions: read                      # ci-gate reads the ci runs
  pages: write                       # tools/pages_wait.sh reads the Pages builds (and asks for one if none started)
jobs:
  # ci.yml already runs every host test (host + generators-macos) on each push to main. If ci passed on exactly this
  # commit (waiting up to 40 min if it is still running), or on a commit with the identical git tree (the PR's head,
  # when this tag is on GitHub's merge commit of it: the same code), the release skips its own copy of the tests; if
  # ci failed, never ran or timed out, the fallback jobs below (host, generators-macos) run them here, and a failure stops the
  # release before the build and publish.
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/ci_gate.sh "$GITHUB_SHA"
  generators-macos:                  # fallback only: the tables regenerate byte for byte (macOS, as ci.yml)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - shell: bash                  # (one run; its -v lines show the deterministic test PASSED, not SKIPPED)
        run: |
          python -m pytest -v -rs tests/py/test_gen_bars.py tests/py/test_marimba_calib.py | tee gen.txt
          grep -q 'test_gen_bars.py::test_deterministic_and_up_to_date PASSED' gen.txt
  host:                              # fallback only: every host test (ci.yml's host job, on the same arm64 runner)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest pytest-xdist==3.8.0
      - name: host tests (fallback only, when ci did not pass on this commit)
        run: make test && make host && make pytest PY=python3
  web:                               # the emulator from the tag, built and selftested before anything is published
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.64.0-noble   # (the browsers' libraries in the image; apt only for xz)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/emsdk
          key: emsdk-${{ hashFiles('tools/get_emsdk.sh') }}-${{ runner.os }}-${{ runner.arch }}-playwright-image
      - name: xz (emsdk unpacks node from a .tar.xz; the image has no xz)
        run: apt-get update -qq && apt-get install -y -qq xz-utils
      - name: Emscripten (the version pinned in tools/get_emsdk.sh)
        run: sh tools/get_emsdk.sh .local/emsdk
      - name: build the emulator
        run: sh web/build.sh --release "${GITHUB_REF_NAME#v}"
      - uses: actions/setup-node@v4   # (Playwright's Python image has no node)
        with:
          node-version: 20
      - name: the installer against a fake FM-1 (node)
        run: node tests/web/install_test.js
      - name: Playwright (Chromium + WebKit)
        run: |
          pip install playwright==1.64.0
          python3 -m playwright install chromium webkit
      - name: selftest
        run: python3 tools/release.py --web-selftest web/dist "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
  release:
    needs: [ci-gate, generators-macos, host, web]
    # runs when ci passed on this commit (the fallback jobs skipped) or when both fallback jobs passed, and the
    # emulator built and passed its selftest. x86_64: the JieLi toolchain (tools/get_toolchain.sh) runs on nothing else
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' && needs.web.result == 'success' &&
      (needs.ci-gate.outputs.passed == 'true' ||
       (needs.generators-macos.result == 'success' && needs.host.result == 'success'))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1
      - name: the JieLi toolchain and the 3 AC79 SDK files (checked by sha256 in the build)
        run: |
          sh tools/get_toolchain.sh .local/jieli
          sh tools/get_sdk.sh .local/fw-AC79_AIoT_SDK
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --release "$V"
          ls -l "build/frodhes-$V.fwsc"
          sha256sum "build/frodhes-$V.fwsc"
      - name: build the SMK-37 packages (experimental)
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --board smk37 --release "$V"
          ./build.sh --board smk37 --model elite --release "$V"
          ./build.sh --board smk37 --model mke --release "$V"
          ls -l "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
          sha256sum "build/frodhes-$V.fwsc" "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" \
            "build/frodhes-$V-smk37-mke.fwsc"
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Frodhes $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          # the same file twice: frodhes-X.Y.Z.fwsc, and frodhes.fwsc, the stable name README / MANUAL link as
          # releases/latest/download/frodhes.fwsc (the docs never name a version)
          mkdir -p build/publish
          cp "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc
          # the SMK-37 packages under fixed names, marked experimental (the SMK-37 is not tested on hardware)
          cp "build/frodhes-$V-smk37.fwsc" build/publish/frodhes-smk37-experimental.fwsc
          cp "build/frodhes-$V-smk37-elite.fwsc" build/publish/frodhes-smk37-elite-experimental.fwsc
          cp "build/frodhes-$V-smk37-mke.fwsc" build/publish/frodhes-smk37-mke-experimental.fwsc
          set -- "build/frodhes-$V.fwsc" build/publish/frodhes.fwsc \
            build/publish/frodhes-smk37-experimental.fwsc build/publish/frodhes-smk37-elite-experimental.fwsc \
            build/publish/frodhes-smk37-mke-experimental.fwsc \
            "LICENSES/Apache-2.0.txt#Apache-2.0.txt (the licence of the 3 JieLi SDK files in each .fwsc)"
          # a draft: nobody sees it until the emulator of this tag is live ("publish the release" below)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a rerun: the release exists already (a draft left by a failed run, or published): its assets replaced
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Frodhes $V" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$@" --title "Frodhes $V" --notes-file "$NOTES" --draft
          fi
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: build/pages
      - name: the packages next to the emulator, the FM-1's and the SMK-37 builds (its installer; release downloads have no CORS)
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh tools/web_firmware.sh "build/frodhes-$V.fwsc" web/dist "$V" \
            "build/frodhes-$V-smk37.fwsc" "build/frodhes-$V-smk37-elite.fwsc" "build/frodhes-$V-smk37-mke.fwsc"
      - name: deploy the emulator
        run: |
          git -C build/pages config user.name "github-actions[bot]"
          git -C build/pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh tools/deploy_pages.sh web/dist build/pages "${GITHUB_REF_NAME#v}"
      - name: wait for Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sh tools/pages_wait.sh "$(git -C build/pages rev-parse HEAD)" web/dist \
            "https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/"
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
