name: release
# A version tag (v0.9.1, v0.9.2 ...) builds the firmware and publishes the GitHub release with the .fwsc attached.
# The notes are docs/releases/<tag>.md. Tag only what passed the tests on the FM-1 (CLAUDE.md: test and document).
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: read                      # ci-gate reads the ci runs
jobs:
  # ci.yml already runs every host test (host + generators-macos) on each push to main. If ci passed on exactly this
  # commit (waiting up to 40 min if it is still running), the release skips its own copy of the tests; if ci failed,
  # never ran or timed out, the fallback below runs them here, and a failure stops the release before publish.
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh tools/ci_gate.sh "$GITHUB_SHA"
  generators-macos:                  # fallback only: the tables regenerate byte for byte (macOS, as ci.yml)
    needs: ci-gate
    if: needs.ci-gate.outputs.passed != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - run: python -m pytest -q -rs tests/py/test_gen_bars.py
      - run: '! python -m pytest -q -rs tests/py/test_gen_bars.py -k deterministic | grep -q SKIPPED'
  release:
    needs: [ci-gate, generators-macos]
    # runs when ci passed on this commit (generators-macos skipped) or when the fallback macOS job passed
    if: >-
      !cancelled() && needs.ci-gate.result == 'success' &&
      (needs.ci-gate.outputs.passed == 'true' || needs.generators-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow numpy==2.5.4 scipy==1.18.1 pytest
      - name: host tests (fallback only, when ci did not pass on this commit)
        if: needs.ci-gate.outputs.passed != 'true'
        run: make test && make pytest PY=python3
      - name: the JieLi toolchain and the 3 AC79 SDK files (checked by sha256 in the build)
        run: |
          sh tools/get_toolchain.sh .local/jieli
          sh tools/get_sdk.sh .local/fw-AC79_AIoT_SDK
      - name: build
        run: |
          V="${GITHUB_REF_NAME#v}"
          ./build.sh --release "$V"
          ls -l "build/frodhes-$V.fwsc"
          sha256sum "build/frodhes-$V.fwsc"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { echo "Frodhes $V" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$GITHUB_REF_NAME" "build/frodhes-$V.fwsc" --title "Frodhes $V" --notes-file "$NOTES" --latest
