name: plugin
# The desktop plugin (plugin/, docs/PLUGIN.md): CLAP + VST3 on macOS, Windows and Linux, the Audio Unit on macOS,
# built, packaged under the release's fixed names, checked self-contained (tools/plugin_depcheck.py) and validated.
# Separate from ci.yml (the firmware's host tests) and from the firmware's release steps: release.yml calls this file
# (workflow_call, with the tag's version) and attaches the packages afterwards (job plugin-release there).
#   macos     universal (arm64 + x86_64, macOS 11): make plugin, make test-plugin (the coroutine, the headless host's
#             selftest, the parameter table, a quick Gate D), the .pkg and the .zip (ad-hoc signed; Developer ID and
#             notarization only when release.yml asks and the secrets exist), the .pkg installed with installer(8)
#             into the runner's home, then clap-validator, pluginval (strictness 10) and auval -strict on it
#   windows   x64 with clang-cl + lld-link and the static CRT (the same toolchain file as the cross build from macOS,
#             tools/plugin_win.sh), the zip, the dependency check, the coroutine (fibers), the window's controller and
#             view self-tests, the headless host's selftest, clap-validator, pluginval
#   linux     x86_64 and aarch64 through tools/plugin_linux.sh (Docker, Ubuntu 20.04, glibc 2.31: the bundles load on
#             20.04 and everything newer), exactly as locally: build, check, the Xvfb tests with a Gate D subset, the
#             zip; linux-validate then loads the x86_64 zip on a current Ubuntu (clap-validator; pluginval
#             non-blocking: JUCE's headless needs vary by image)
# Every job's packages are its artifact (plugin-macos, plugin-windows, plugin-linux-<arch>).
on:
  pull_request:
    paths: ['plugin/**', 'firmware/src/**', 'firmware/gen/**', 'web/web_hal.c', 'tools/plugin_*', 'tools/gate_d.py',
            'tools/gen_plugin_params.py', 'tools/gate_m.py', 'tests/baselines/**', 'Makefile', 'LICENSE', 'LICENSES/**', '.github/workflows/plugin.yml']
  push:
    branches: [main]
    paths: ['plugin/**', 'firmware/src/**', 'firmware/gen/**', 'web/web_hal.c', 'tools/plugin_*', 'tools/gate_d.py',
            'tools/gen_plugin_params.py', 'tools/gate_m.py', 'tests/baselines/**', 'Makefile', 'LICENSE', 'LICENSES/**', '.github/workflows/plugin.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'the version text (the tag, v stripped); empty: 0.0.0-dev'
        type: string
        default: ''
      sign:
        description: 'macOS: Developer ID signing + notarization when the secrets exist (release.yml only)'
        type: boolean
        default: false
concurrency:
  group: plugin-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PLUGIN_NICE: ''                    # (a runner is not the user's laptop: no nice)
  PLUGIN_J: '3'
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/plugin-deps
          key: plugin-deps-${{ hashFiles('plugin/deps.lock') }}-macos
      - name: the pinned dependencies and test tools (plugin/deps.lock)
        run: sh tools/plugin_deps.sh
      - name: version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          echo "PLUGIN_VER=${V:-0.0.0-dev}" >> "$GITHUB_ENV"
      - name: build (universal)
        run: make plugin
      - name: tests (coroutine, headless host selftest, parameter table, quick Gate D)
        run: make test-plugin PY=python3
      # ---- Developer ID signing (docs/PLUGIN.md "Signing"): only for release.yml, only with every secret present.
      # Without them the bundles are signed ad hoc and the .pkg is unsigned (the documented default).
      - name: Developer ID (release only, when the secrets exist)
        if: ${{ inputs.sign }}
        env:
          P12: ${{ secrets.MACOS_DEVID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          SIGN_ID: ${{ secrets.MACOS_SIGN_ID }}
          INSTALLER_ID: ${{ secrets.MACOS_INSTALLER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$SIGN_ID" ] || [ -z "$INSTALLER_ID" ] || [ -z "$NOTARY_PASSWORD" ]; then
            echo "::notice::no Developer ID secrets: the macOS packages stay ad-hoc signed"; exit 0
          fi
          K="$RUNNER_TEMP/sign.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$K"
          security set-keychain-settings -lut 3600 "$K"
          security unlock-keychain -p "$KP" "$K"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$K" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$K" >/dev/null
          security list-keychains -d user -s "$K" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials frodhes --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$K"
          { echo "FRP_SIGN_ID=$SIGN_ID"; echo "FRP_INSTALLER_ID=$INSTALLER_ID"; echo "FRP_NOTARY_PROFILE=frodhes"; } >> "$GITHUB_ENV"
      - name: packages (frodhes-plugin-macos.pkg, frodhes-plugin-macos.zip)
        run: sh tools/plugin_pack.sh macos
      - name: the .pkg installed as a user installs it (installer(8), the runner's home, no administrator)
        run: |
          installer -pkg build/plugin-pkg/frodhes-plugin-macos.pkg -target CurrentUserHomeDirectory
          P=~/Library/Audio/Plug-Ins
          ls -d "$P/CLAP/Frodhes.clap" "$P/VST3/Frodhes.vst3" "$P/Components/Frodhes.component"
          pkgutil --check-signature build/plugin-pkg/frodhes-plugin-macos.pkg || true
      - name: self-contained (universal, macOS 11, system libraries only)
        run: python3 tools/plugin_depcheck.py macos ~/Library/Audio/Plug-Ins
      - name: clap-validator (CLAP)
        run: .local/plugin-deps/clap-validator/binaries/clap-validator validate ~/Library/Audio/Plug-Ins/CLAP/Frodhes.clap
      - name: pluginval (VST3, strictness 10, with the editor tests)
        run: |
          .local/plugin-deps/pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 \
            --validate-in-process --validate ~/Library/Audio/Plug-Ins/VST3/Frodhes.vst3
      - name: auval (Audio Unit, strict)
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aumu Frd1 Frdh
      - name: the zip holds the same bundles as the .pkg
        run: |
          ditto -x -k build/plugin-pkg/frodhes-plugin-macos.zip "$RUNNER_TEMP/zip"
          for x in CLAP/Frodhes.clap VST3/Frodhes.vst3 Components/Frodhes.component; do
            diff -r "$RUNNER_TEMP/zip/Frodhes/$x" ~/Library/Audio/Plug-Ins/$x
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-macos
          path: |
            build/plugin-pkg/frodhes-plugin-macos.pkg
            build/plugin-pkg/frodhes-plugin-macos.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: LF line endings (the shell scripts and deps.lock are read by sh)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/plugin-deps
          key: plugin-deps-${{ hashFiles('plugin/deps.lock') }}-windows
      - name: the pinned dependencies and the test tools (plugin/deps.lock)
        run: sh tools/plugin_deps.sh
      - name: version
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          echo "FRP_VER=${V:-0.0.0-dev}" >> "$GITHUB_ENV"
      - name: build (x64, clang-cl + lld-link, the static CRT; plugin/cmake/win-x64-clangcl.cmake)
        shell: cmd                     # (vcvars64 gives clang-cl the Windows SDK and the MSVC CRT: INCLUDE, LIB)
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S plugin -B build/plugin-win -G Ninja -DCMAKE_TOOLCHAIN_FILE=%CD%/plugin/cmake/win-x64-clangcl.cmake -DFRP_VERSION=%FRP_VER% || exit /b 1
          cmake --build build/plugin-win -j3 || exit /b 1
      - name: package (frodhes-plugin-windows.zip)
        run: sh tools/plugin_pack.sh windows
      - name: unpack the zip (what a user copies)
        run: cmake -E make_directory "$RUNNER_TEMP/w" && cd "$RUNNER_TEMP/w" && cmake -E tar xf "$GITHUB_WORKSPACE/build/plugin-pkg/frodhes-plugin-windows.zip"
      - name: self-contained (Windows' own DLLs only, the static CRT)
        run: FRP_OBJDUMP="$(cygpath -u "$PROGRAMFILES")/LLVM/bin/llvm-objdump.exe" python tools/plugin_depcheck.py windows "$RUNNER_TEMP/w/Frodhes"
      - name: the coroutine (fibers), the window's controller and view, the headless host's selftest
        run: |
          build/plugin-win/frp_test_coro.exe
          build/plugin-win/frp_test_gui_ctl.exe
          build/plugin-win/frp_gui_demo.exe --selftest
          build/plugin-win/frp_clap_render.exe "$RUNNER_TEMP/w/Frodhes/CLAP/Frodhes.clap" --selftest
      - name: clap-validator (CLAP)
        run: .local/plugin-deps/clap-validator/clap-validator.exe validate "$RUNNER_TEMP/w/Frodhes/CLAP/Frodhes.clap"
      - name: pluginval (VST3, strictness 10, with the editor tests)
        run: |
          .local/plugin-deps/pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process \
            --validate "$RUNNER_TEMP/w/Frodhes/VST3/Frodhes.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-windows
          path: build/plugin-pkg/frodhes-plugin-windows.zip
          if-no-files-found: error

  linux:
    name: linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      FRP_LINUX_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/plugin-deps
          key: plugin-deps-${{ hashFiles('plugin/deps.lock') }}-linux-${{ matrix.arch }}
      - name: the pinned dependencies (plugin/deps.lock)
        run: sh tools/plugin_deps.sh --libs
      - name: build in Ubuntu 20.04 (glibc 2.31; tools/plugin_linux.sh, as locally)
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          FRP_VERSION="${V:-0.0.0-dev}" bash tools/plugin_linux.sh build
      - name: self-contained (libc, libm, libdl, libpthread, libX11 / libxcb only; glibc <= 2.31), the exports, the stack
        run: bash tools/plugin_linux.sh check
      - name: the coroutine, the window's controller, the X11 view (Xvfb), the selftest, a Gate D subset
        run: bash tools/plugin_linux.sh test
      - name: package (frodhes-plugin-linux-${{ matrix.arch }}.zip)
        run: bash tools/plugin_linux.sh pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-linux-${{ matrix.arch }}
          path: build/plugin-pkg/frodhes-plugin-linux-${{ matrix.arch }}.zip
          if-no-files-found: error

  linux-validate:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: the test tools (plugin/deps.lock, Linux builds)
        run: sh tools/plugin_deps.sh
      - uses: actions/download-artifact@v4
        with:
          name: plugin-linux-x86_64
          path: build/plugin-pkg
      - name: unpack the zip
        run: mkdir -p "$RUNNER_TEMP/l" && unzip -q build/plugin-pkg/frodhes-plugin-linux-x86_64.zip -d "$RUNNER_TEMP/l"
      - name: clap-validator (CLAP, a current Ubuntu)
        run: |
          V=$(find .local/plugin-deps/clap-validator -name clap-validator -type f | head -n 1)
          chmod +x "$V" && "$V" validate "$RUNNER_TEMP/l/Frodhes/Frodhes.clap"
      - name: pluginval (VST3, strictness 10; non-blocking)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libfreetype6 libcurl4t64 >/dev/null || true
          P=$(find .local/plugin-deps/pluginval -name pluginval -type f | head -n 1)
          chmod +x "$P"
          xvfb-run -a "$P" --strictness-level 10 --skip-gui-tests --validate-in-process \
            --validate "$RUNNER_TEMP/l/Frodhes/Frodhes.vst3"
